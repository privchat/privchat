# server → downstream 统一出站配置（v1.1 起合并 channel_transfer + service_account_event）
# spec: 02-server/SERVER_EVENT_DISPATCH_SPEC §3
# 所有 server emit 都走这里：transfer.requested + bot.followed + bot.unfollowed + ...
# v1 复用同一把 application master key（与 application 端 privchat.conf 的 service_master_key 一致）
[server_event]
application_url = "http://localhost:8080"
application_master_key = "CHANGE_ME_service_master_key"
timeout_ms = 3000

# Room subscribe ticket（spec 02-server/ROOM_CHANNEL_SPEC §4）
# secret 是 HMAC-SHA256 key。生产环境通过 env 覆盖。
# default_kid: 签发用的 key id；和 keys 多 key 一起用做轮换。
[room_ticket]
secret = "CHANGE_ME_room_ticket_hmac_secret"
default_kid = "v1"
leeway_secs = 30

# 附件加密（ATTACHMENT_ENCRYPTION_SPEC）。
#
# 🔴 威胁模型是**对象存储服务商**——不少厂商会拿用户图片视频去训练。所以明文不进桶，
#    加解密在客户端；服务端只在首传校验时短暂持有明文。
#
# 🔴 **这把密钥会下发给每一个能申请上传 token 的用户**，因此它的作用**只有**
#    「桶里看不到明文」。它不是用户之间的访问隔离：
#      · 任何一个用户泄露了它，只要拿到密文就能解开同 key_id 的全部对象；
#      · 所以 COS 必须私有桶，下载 URL 必须鉴权、短期有效。
#    访问控制的唯一入口是 file/get_url，不是加密。
#
# 生成：openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
#
# 第一项 = 当前上传使用；其余保留给老对象解密。将来换密钥时把新的插到最前，
# 老的留着——客户端按密文头里的 key_id 自己挑，不需要重新加密存量对象。
# [[attachment.keys]]
# id  = 1
# key = "<base64url(no-pad) 的 32 字节>"

[logging]
level = "info"
format = "compact"
file = "./logs/server.log"

# ==========================================
# 系统消息配置
# ==========================================
[system_message]
# 是否启用系统消息用户
enabled = true

# 新用户注册时的欢迎消息
welcome_message = """
👋 欢迎使用 Privchat！

这是一个端到端加密的即时通讯系统，您的隐私安全由我们守护。

🔐 主要特性：
• 端到端加密通讯
• 多设备同步
• 离线消息推送
• 文件安全传输

如有任何问题，欢迎随时联系我们！
"""

# 是否在用户注册时自动创建与系统用户的会话
auto_create_channel = true

# 是否在创建会话后自动发送欢迎消息
auto_send_welcome = true

# ==========================================
# 消息配置（撤回时效等）
# ==========================================
[message]
# 普通用户撤回自己消息的时效（秒）。群主/管理员不受此限制。
#   > 0  : 普通用户仅能在发送后该秒数内撤回（例如 172800 = 48 小时）
#   0    : 不限制时效，普通用户任意时间均可撤回自己的消息
recall_time_limit_secs = 0
