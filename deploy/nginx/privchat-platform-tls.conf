# Platform API over TLS on a bare IP.
#
# The app sends the login password, the refresh token and the Bearer access
# token to this endpoint. On plain HTTP those cross the public internet in the
# clear; a domain would need ICP filing, so this terminates TLS with the same
# long-lived self-signed certificate the IM gateway presents and the client
# pins its SPKI. One pin covers QUIC, TLS/TCP and this endpoint.
#
# Port 8081 must remain closed in the cloud security group and host firewall.
#
# The certificate lives at /etc/privchat/tls (0600, root). nginx workers cannot
# read that, so deploy/README.md documents the 0640 root:nginx copy.
server {
    listen 8080 ssl;
    server_name _;

    ssl_certificate     /etc/privchat/tls-nginx/server.crt;
    ssl_certificate_key /etc/privchat/tls-nginx/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
