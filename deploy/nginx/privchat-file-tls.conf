# File control plane over TLS on a bare IP.
#
# The upload token and the part-url / status / complete / abort calls carried it
# in the clear. Same certificate, therefore the same SPKI pin as everything else.
#
# 🔴 Do not enable this before the clients ship the pinned file-control client.
# The Rust SDK used a default reqwest client here, which trusts system roots and
# cannot verify a self-signed certificate: turning this on first breaks every
# upload. That happened on 2026-08-31 and had to be rolled back.
#
# Requires privchat/config.toml: server_port = 9084 (loopback) and
# server_api_base_url = "https://<ip>:9083/api/app".
server {
    listen 9083 ssl;
    server_name _;

    ssl_certificate     /etc/privchat/tls-nginx/server.crt;
    ssl_certificate_key /etc/privchat/tls-nginx/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:9084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
