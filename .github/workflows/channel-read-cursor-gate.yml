name: channel-read-cursor-gate

on:
  pull_request:
    paths:
      - "src/service/**"
      - "src/rpc/**"
      - "src/repository/**"
      - "src/infra/**"
      - "src/context.rs"
      - "migrations/**"
      - "tests/channel_read_cursor_gate_test.rs"
      - "tests/protocol_non_db_gate_test.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/channel-read-cursor-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/service/**"
      - "src/rpc/**"
      - "src/repository/**"
      - "src/infra/**"
      - "src/context.rs"
      - "migrations/**"
      - "tests/channel_read_cursor_gate_test.rs"
      - "tests/protocol_non_db_gate_test.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/channel-read-cursor-gate.yml"

jobs:
  read-cursor-gate:
    name: channel-read-cursor-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: privchat-server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: privchat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d privchat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/privchat_test
      PRIVCHAT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/privchat_test
      PRIVCHAT_TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
        with:
          path: privchat-server
      - uses: actions/checkout@v4
        with:
          repository: zoujiaqing/msgtrans
          ref: 2c3086dc3b12da75aa20f0fbec448620b9a126e9
          path: msgtrans
      - uses: actions/checkout@v4
        with:
          repository: privchat/privchat-protocol
          ref: c5cbe557090deeb8b9f41d53ff0414ce949bb8ef
          path: privchat-protocol

      - uses: actions/checkout@v4
        with:
          repository: google/flatbuffers
          ref: v25.12.19-2026-02-06-03fffb2
          path: flatbuffers
      - name: Build pinned FlatBuffers compiler
        run: |
          cmake -S "$GITHUB_WORKSPACE/flatbuffers" -B "$RUNNER_TEMP/flatc-build" -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/flatc-build" --target flatc --parallel 2
          echo "$RUNNER_TEMP/flatc-build" >> "$GITHUB_PATH"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: privchat-server

      - name: Apply schema migrations
        run: |
          # Apply every migration in order. 001 is the squashed baseline schema;
          # 002+ are increments. 000 is the dev-only drop-everything script and is
          # deliberately skipped.
          #
          # Do not list files by hand here: the previous version named
          # 002_add_message_partitions_... and 003_channel_read_cursor.sql, which
          # stopped existing when the migrations were squashed and renumbered, and
          # this gate had been failing on a missing file ever since.
          shopt -s nullglob
          for f in migrations/*.sql; do
            case "$(basename "$f")" in 000_*) continue ;; esac
            echo "apply $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Server compile check (sqlx online)
        run: RUSTC_WRAPPER= cargo check

      - name: Channel read cursor gate tests
        run: RUSTC_WRAPPER= cargo test --test channel_read_cursor_gate_test -- --nocapture

      - name: Protocol non-db gate tests
        run: RUSTC_WRAPPER= cargo test --test protocol_non_db_gate_test -- --nocapture

      - name: Committed timeline delivery database tests
        run: RUSTC_WRAPPER= cargo test --lib service::committed_timeline_delivery_service::tests -- --nocapture

      - name: Atomic revoke and PostgreSQL readiness
        run: |
          RUSTC_WRAPPER= cargo test --lib a_revoked_message_stops_counting_as_a_live_reference -- --nocapture
          RUSTC_WRAPPER= cargo test --lib postgres_readiness_rejects_a_closed_pool -- --nocapture

      - name: Difference page gap with real PostgreSQL and Redis
        run: RUSTC_WRAPPER= cargo test --lib difference_recovers_a_missing_cached_revoke_from_postgres -- --ignored --nocapture
