# server → downstream 统一出站配置（v1.1 起合并 channel_transfer + service_account_event）
# spec: 02-server/SERVER_EVENT_DISPATCH_SPEC §3
# 所有 server emit 都走这里：transfer.requested + bot.followed + bot.unfollowed + ...
# v1 复用同一把 application master key（与 application 端 privchat.conf 的 service_master_key 一致）
[server_event]
application_url = "http://localhost:8080"
application_master_key = "your_service_master_key_here"
timeout_ms = 3000

# Room subscribe ticket（spec 02-server/ROOM_CHANNEL_SPEC §4）
# secret 是 HMAC-SHA256 key。生产环境通过 env 覆盖。
# default_kid: 签发用的 key id；和 keys 多 key 一起用做轮换。
[room_ticket]
secret = "dev-room-ticket-secret-please-rotate-in-prod"
default_kid = "v1"
leeway_secs = 30

# 附件加密密钥（ATTACHMENT_ENCRYPTION_SPEC §0.1，v2 全站统一密钥）。
#
# 🔴 威胁模型是**对象存储服务商**——不少厂商会拿用户图片视频去训练。桶里只存密文，
#    明文不落盘。
#
# 🔴 但**不要**把它理解成"服务端从不接触明文"：complete 时服务端会流式回读密文、
#    用这把密钥解开、重算明文摘要，与 token 冻结的身份比对。那一步是跨用户秒传的
#    地基——判重键是明文摘要，而"密文摘要对得上"证明不了"这串字节就是你声明的
#    那份内容"。解密只发生在校验的那一趟，明文用完即弃、不落盘。
#
# 🔴 也不要把它当成用户之间的隔离：这把密钥下发给**每一个**能申请上传 token 的
#    用户，谁泄露了它，拿到密文就能解开同 key_id 的全部对象。访问控制的唯一入口
#    是 file/get_url 的鉴权 + 私有桶 + 短期 URL，不是加密本身。
#
# 🔴 密钥只经由已鉴权的接口下发（request_upload_token / file/get_url），
#    绝不进 URL、不进日志。
#
# 第一项 = 当前上传使用；其余保留给老对象解密（轮换时把新密钥插到最前面，
# 老的留着，客户端按密文头里的 key_id 自己挑，不需要重新加密存量对象）。
#
# 🔴 **没有"留空就退回 v1"这条路**：没有配置密钥时签发直接失败（fail-closed）。
#    "没配就当明文"是 fail-open——一次配置遗漏会让全部新附件明文进桶，而桶里
#    看起来一切正常。
#
# 生成：openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
# 🔴 **密钥不写在这里。** config.toml 受 Git 跟踪，而这把密钥能解开同一 key_id 下的
# 全部附件——提交进仓库等于一次 clone 就全泄。改用环境变量（`.env` 不进版本库）：
#
#   PRIVCHAT_ATTACHMENT_KEYS="1:<base64url(no-pad) 的 32 字节>"
#
# 多把用逗号分隔，第一项 = 当前上传使用，其余保留给老对象解密。
# 生成：openssl rand -base64 32 | tr '+/' '-_' | tr -d '='

[logging]
level = "info"
format = "compact"
file = "./logs/server.log"

# ==========================================
# 系统消息配置
# ==========================================
[system_message]
# 是否启用系统消息用户
enabled = true

# 新用户注册时的欢迎消息
welcome_message = """
👋 欢迎使用 Privchat！

这是一个端到端加密的即时通讯系统，您的隐私安全由我们守护。

🔐 主要特性：
• 端到端加密通讯
• 多设备同步
• 离线消息推送
• 文件安全传输

如有任何问题，欢迎随时联系我们！
"""

# 是否在用户注册时自动创建与系统用户的会话
auto_create_channel = true

# 是否在创建会话后自动发送欢迎消息
auto_send_welcome = true

# ==========================================
# 消息配置（撤回时效等）
# ==========================================
[message]
# 普通用户撤回自己消息的时效（秒）。群主/管理员不受此限制。
#   > 0  : 普通用户仅能在发送后该秒数内撤回（例如 172800 = 48 小时）
#   0    : 不限制时效，普通用户任意时间均可撤回自己的消息
recall_time_limit_secs = 0
